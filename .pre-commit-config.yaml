# Root pre-commit hooks (docs/REPOSITORY.md, umbrella task U0.1).
# Set up once per clone: pre-commit install
# Each part adds its own hooks in its first build task, below its own heading (CLAUDE.md rule 2).
# The secret scan calls a locally installed gitleaks (brew install gitleaks).
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]

repos:
  # --- Umbrella: shared-contract guard ---
  - repo: local
    hooks:
      - id: changelog-guard
        name: Shared-contract change needs docs/CHANGELOG.md
        entry: scripts/changelog_guard.sh --staged
        language: script
        pass_filenames: false
        always_run: true
      - id: changelog-guard-tests
        name: Changelog guard tests
        entry: bash scripts/tests/changelog_guard_test.sh
        language: system
        pass_filenames: false
        files: ^scripts/(changelog_guard\.sh|tests/changelog_guard_test\.sh)$

  # --- Umbrella: secret scanner ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # Upstream omits this for the system variant; gitleaks reads the index itself.
        pass_filenames: false

  # --- Umbrella: basic file checks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=20480, --enforce-all]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # Exported bundles are hashed byte for byte (Case Library SPEC §7.5); never rewrite them.
      - id: end-of-file-fixer
        exclude: ^case-library/exports/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^case-library/exports/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^case-library/exports/

  # --- Case Library hooks (added by L0.1) ---
  # Versions match the exact pins in case-library/pyproject.toml; ruff and mypy read their
  # settings from there. Tests run in the Case Library workflow, not here.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        name: "Case Library: ruff check"
        files: ^case-library/.*\.py$
      - id: ruff-format
        name: "Case Library: ruff format"
        files: ^case-library/.*\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: "Case Library: mypy"
        files: ^case-library/(scripts|tests)/.*\.py$
        args: [--config-file=case-library/pyproject.toml]
        additional_dependencies: ["psycopg[binary]==3.3.6", "pytest==9.1.1", "types-openpyxl==3.1.5.20260827"]
  # --- Nidana hooks (added by N1.1) ---
  # Prettier formats Nidana's code and JSON (Markdown is written by hand). ESLint, type-checks
  # and tests run in the Nidana workflow. The version matches nidana/packages/*/package.json.
  - repo: local
    hooks:
      - id: nidana-prettier
        name: "Nidana: prettier"
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: ^nidana/.*\.(ts|tsx|js|mjs|cjs|json)$
  # --- Sambhasha hooks (added by P0.1) ---
  # Versions match the exact pins in sambhasha/pyproject.toml; ruff and mypy read their
  # settings from there. Tests run in the Sambhasha workflow, not here.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        name: "Sambhasha: ruff check"
        files: ^sambhasha/(src|tests)/.*\.py$
      - id: ruff-format
        name: "Sambhasha: ruff format"
        files: ^sambhasha/(src|tests)/.*\.py$
  - repo: local
    hooks:
      - id: sambhasha-mypy
        name: "Sambhasha: mypy"
        # mypy needs the installed package and pydantic's plugin, so it runs from the uv environment.
        entry: bash -c 'cd sambhasha && uv run --locked mypy'
        language: system
        files: ^sambhasha/(src|tests)/.*\.py$
        pass_filenames: false
