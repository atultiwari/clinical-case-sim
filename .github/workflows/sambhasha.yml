# Sambhasha workflow (sambhasha/docs/PLAN.md, task P0.1): lint, type-check and unit tests.
# Runs only when Sambhasha's files or this workflow change. No test calls a network model.
name: sambhasha

on:
  pull_request:
    branches: [main]
    paths:
      - "sambhasha/**"
      - ".github/workflows/sambhasha.yml"
  push:
    branches: [main]
    paths:
      - "sambhasha/**"
      - ".github/workflows/sambhasha.yml"

permissions:
  contents: read

concurrency:
  group: sambhasha-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sambhasha

jobs:
  check:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sambhasha

      - name: Install
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest

  integration:
    name: All tests, with the local database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sambhasha

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Install
        run: uv sync --locked

      # Only Postgres is needed; starting it applies every migration in supabase/migrations/.
      - name: Start the local database
        run: supabase db start

      - name: Tests
        env:
          SAMBHASHA_REQUIRE_DB: "1"
        run: uv run pytest -m "integration or not integration"

      - name: Stop the local database
        if: always()
        run: supabase stop --no-backup
