# Nidana workflow (nidana/docs/PLAN.md, task N1.1): lint, type-check and tests.
# Runs when Nidana's files change, and when the Case Library's bundle schema or exports change,
# because Nidana's contracts are generated from the schema and its tests load every export.
name: nidana

on:
  pull_request:
    branches: [main]
    paths:
      - "nidana/**"
      - "case-library/schemas/**"
      - "case-library/exports/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nidana.yml"
  push:
    branches: [main]
    paths:
      - "nidana/**"
      - "case-library/schemas/**"
      - "case-library/exports/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nidana.yml"

permissions:
  contents: read

concurrency:
  group: nidana-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nidana

jobs:
  check:
    name: Lint, type-check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter "./**" --fail-if-no-match run lint

      - name: Type-check
        run: pnpm --filter "./**" --fail-if-no-match run typecheck

      # No network access and no paid API calls in tests (nidana/CLAUDE.md).
      - name: Tests
        run: pnpm --filter "./**" --fail-if-no-match run test

      - name: Build the game server
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @nidana/server build

      # N1.5: the pilot's benchmark path through the web build of the player app.
      - name: Install the Playwright browser
        run: pnpm --filter @nidana/player exec playwright install --with-deps chromium

      - name: End-to-end test on the web build
        run: pnpm --filter @nidana/player e2e

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-screenshots
          path: nidana/apps/player/test-results/
          retention-days: 14

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The images Coolify deploys (nidana/docs/DEPLOY.md). Built only, never pushed.
      - name: Game server image
        run: docker build -f nidana/apps/server/Dockerfile -t nidana-server:ci .

      - name: Web build image
        run: >-
          docker build -f nidana/apps/player/Dockerfile.web
          --build-arg EXPO_PUBLIC_API_URL=https://api.example.invalid
          --build-arg EXPO_PUBLIC_SUPABASE_URL=https://example.invalid
          --build-arg EXPO_PUBLIC_SUPABASE_KEY=placeholder
          -t nidana-web:ci .
