# Case Library workflow (case-library/docs/PLAN.md, task L0.1): lint, type-check and tests.
# Runs only when the Case Library's files or this workflow change.
name: case-library

on:
  pull_request:
    branches: [main]
    paths:
      - "case-library/**"
      - ".github/workflows/case-library.yml"
  push:
    branches: [main]
    paths:
      - "case-library/**"
      - ".github/workflows/case-library.yml"

permissions:
  contents: read

concurrency:
  group: case-library-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: case-library

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: case-library

      - name: Install
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (with the local database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: case-library

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Install
        run: uv sync --locked

      # Only Postgres is needed for migration and integration tests; it starts faster
      # than the whole stack and applies every migration in supabase/migrations/.
      - name: Start the local database
        run: supabase db start

      - name: Tests
        env:
          CASE_LIBRARY_REQUIRE_DB: "1"
        run: uv run pytest

      - name: Stop the local database
        if: always()
        run: supabase stop --no-backup

  # The Case Studio (L0.7): runs only when the Studio, the lockfile or this workflow change.
  studio:
    name: Case Studio (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the Studio change?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (a new branch, a force push): run the job anyway.
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE_SHA" HEAD -- case-library/studio pnpm-lock.yaml .github/workflows/case-library.yml; then
            echo "studio=false" >> "$GITHUB_OUTPUT"
          else
            echo "studio=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.studio == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.studio == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.studio == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.studio == 'true'
        run: pnpm --filter @case-library/studio lint

      - name: Type-check
        if: steps.changes.outputs.studio == 'true'
        run: pnpm --filter @case-library/studio typecheck

      # Unit tests; the integration tests skip without CASE_VAULT_DB_URL_READONLY.
      - name: Tests
        if: steps.changes.outputs.studio == 'true'
        run: pnpm --filter @case-library/studio test

      - name: Build
        if: steps.changes.outputs.studio == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @case-library/studio build
