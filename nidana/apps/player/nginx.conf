# The web build of the player app: static files, one page (Expo Router "single" output).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # nginx drops server-level headers in a location that adds its own, so each location includes them.
  # Hashed bundles never change; the page itself is always fetched fresh.
  location /_expo/static/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
