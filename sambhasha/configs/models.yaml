# Model profiles per role (SPEC §11; D-020). Model ids live only here.
# The pilot (P1.11) runs on Google's FREE Gemini API (Atul, 27 Sep 2026; decision D-028).
# The recommended paid profiles for production and the study are in models.openrouter.yaml.
#
# Free tier, two things to know:
# - Google may use what is sent (the case, and for the Synthetic Findings Service the ground
#   truth) to improve its products. The pilot cases are already public and development-only
#   (S-010); never send a study or held-out case to the free tier.
# - Requests are rate limited per model and per project. rpm and rpd below are this project's
#   limits: check AI Studio (Rate limits) and correct them here. The gateway paces to rpm,
#   waits when Google says so, and stops a run cleanly when the daily quota is used up;
#   rerunning replays the cached replies for free. Each run reports the time spent waiting,
#   which a paid tier would largely have saved.
#
# Paid-tier prices for comparison (per million tokens, in / out, to 31 Dec 2026):
# gemini-3.8-flash USD 0.75 / 3.75; gemini-2.5-flash 0.30 / 2.50; gemini-3.5-flash-lite 0.30 / 2.50.

family_exception: >-
  D-028: pilot on the free Gemini API only, so the Synthetic Findings Service and the
  Evaluator share the doctor seats' family. The pilot cases are development-only (S-010);
  restore D-010 (models.openrouter.yaml) before the study.

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    reports_cost: false        # the free tier costs nothing
    sdk_retries: 0             # rate limits are handled (and timed) by Sambhasha itself

profiles:
  doctor-a:                    # Google's most capable Flash model; free tier
    provider: gemini
    model: gemini-3.8-flash
    family: google
    temperature: 0
    max_tokens: 2000
    rpm: 10
    rpd: 20                    # measured 2026-09-27: the free tier allows 20 a day
  doctor-b:                    # an older generation, for the pilot's second profile
    provider: gemini
    model: gemini-2.5-flash
    family: google
    temperature: 0
    max_tokens: 2000
    rpm: 10
    rpd: 250
  matcher:                     # only picks catalogue items: the cheapest capable model
    provider: gemini
    model: gemini-3.5-flash-lite
    family: google
    temperature: 0
    max_tokens: 400
    rpm: 15
    rpd: 1000
  synthetic:                   # same model as the doctors, as Atul allowed (D-028)
    provider: gemini
    model: gemini-3.8-flash
    family: google
    temperature: 0
    max_tokens: 1500
    rpm: 10
    rpd: 250

roles:
  attending: doctor-a
  challenger: doctor-a
  consultant: doctor-a
  service: doctor-a
  matcher: matcher
  synthetic: synthetic
  curator: matcher
  evaluator: synthetic
