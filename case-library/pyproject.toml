[project]
name = "case-library"
version = "0.1.0"
description = "Case Library scripts for the Case Vault (Clinical-Case-Sim). Educational and research use only."
readme = "CLAUDE.md"
requires-python = "==3.12.*"
dependencies = [
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
# ruff and mypy are pinned exactly: the root .pre-commit-config.yaml runs the same versions.
dev = [
    "jsonschema>=4.25,<5",
    "mypy==2.3.1",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff==0.16.9",
    "types-jsonschema>=4.25",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--cov=scripts", "--cov-report=term-missing", "--cov-fail-under=80"]
markers = [
    "integration: needs the local database from `supabase start` (skipped when it is not running)",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
